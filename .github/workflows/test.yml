name: Product Automation Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:content
      - name: Browser fixtures
        run: npm run test:content:browser
